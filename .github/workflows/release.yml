name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      BUILD_TOOLS_VERSION: '36.0.0'

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate the release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v1.0.0, got: $RELEASE_TAG" >&2
            exit 1
          fi
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          if [[ "$RELEASE_TAG" != "v$version_name" ]]; then
            echo "Release tag $RELEASE_TAG does not match versionName $version_name" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION"

      - name: Test, lint, and build the release APK
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Sign and verify the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          : "${KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Set the ANDROID_KEYSTORE_PASSWORD repository secret}"
          umask 077
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          mkdir -p dist
          apk="dist/share-as-vxtwitter-$RELEASE_TAG.apk"
          "$build_tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias release \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          cd dist
          sha256sum "share-as-vxtwitter-$RELEASE_TAG.apk" > "share-as-vxtwitter-$RELEASE_TAG.apk.sha256"

      - name: Attach the APK and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/share-as-vxtwitter-$RELEASE_TAG.apk" \
            "dist/share-as-vxtwitter-$RELEASE_TAG.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
